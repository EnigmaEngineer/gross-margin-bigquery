name: gross_margin
version: "0.0.1"
config-version: 2

profile: gross_margin

model-paths: ["models"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# The raw layer is loaded outside dbt. scripts/load_duckdb.py reads the generated
# csv files into the raw schema for the duckdb target, and on BigQuery the same
# tables arrive from the landing bucket. Sources point at `raw` either way so the
# model code does not know which loader ran.
vars:
  raw_schema: raw

  # How far back the allocation incremental reprocesses, in days of posted_date.
  # Deliberately generous. scripts/lookback_probe.py measures what each candidate
  # window would miss and the reconciliation work is where a number gets chosen,
  # so nothing here should be read as a tuned value.
  allocation_lookback_days: 180

  # How far back the billing to ledger reconciliation reopens closed periods,
  # in days of ledger posting date. 150 sits 19 days above the worst pooled 99th
  # centile of credit arrival over the five seeds scripts/window_spread.py
  # refits, which is 131. It is declared with its coverage and not as a bound,
  # because the maximum arrival over those same seeds moves 52 days and no
  # finite window bounds that tail. The credits outside it are what
  # alert_late_credit_arrival exists to raise. transform/macros/reconciliation.sql
  # carries the argument.
  recon_reopen_days: 150

  # The policy tag the restricted columns carry on BigQuery. Empty by default and
  # it has to stay empty, because the real value names a project and a taxonomy
  # that do not exist yet. infra/access.tf creates the tag and its output is
  # where the value comes from once there is a project to create it in.
  #
  # The columns that carry it are not listed here. They are listed in
  # gross_margin/access.py and tests/test_access.py reads the parsed manifest to
  # check that the set in the yaml is the set the rule list asks for.
  cost_policy_tag: ""

models:
  gross_margin:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
      # Required for the column policy tags in models/marts/_models.yml to be
      # applied. Without it dbt records the tag in the manifest and never sends
      # it, which is a column security story that parses and does nothing.
      +persist_docs:
        columns: true
    scan:
      # The scan pair exists to be queried, not to be read. Both halves hold the
      # same rows so that the only difference a query sees is the physical layout.
      # That makes each of them a second copy of every restricted column, which is
      # why they carry the same policy tags the line table does.
      +materialized: table
      +schema: marts
      +persist_docs:
        columns: true
