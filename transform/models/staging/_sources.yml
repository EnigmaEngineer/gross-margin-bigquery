version: 2

sources:
  - name: raw
    description: >
      The generated corpus as it lands, every column text. On DuckDB these are
      tables created by scripts/load_duckdb.py from the csv files. On BigQuery
      they are external or loaded tables over the same files in the landing
      bucket. Nothing in this layer has been cast or cleaned.
    schema: "{{ var('raw_schema') }}"
    tables:
      - name: vendors
      - name: partners
      - name: products
      - name: plans
      - name: invoices
      - name: invoice_lines
      - name: credit_memos
      - name: gl_entries
