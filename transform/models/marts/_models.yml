version: 2

models:
  - name: dim_product_version
    description: >
      One row per product version, closed with the start of the next version and
      left open on the current one.
    columns:
      - name: product_id
        tests: [not_null]
      - name: product_line
        tests: [not_null]

  - name: fct_invoice_line_margin
    description: >
      Line grain at the margin the invoice claims. No credit is applied here.
    columns:
      - name: line_id
        tests: [unique, not_null]
      - name: invoiced_margin_usd
        tests: [not_null]
      - name: invoice_date
        tests: [not_null]

  - name: fct_credit_memo
    description: >
      Credit grain, resolved to the line it quotes where that line exists.
      is_placeable is false for a credit naming a line this system does not hold.
    columns:
      - name: credit_id
        tests: [unique, not_null]
      - name: amount_usd
        tests: [not_null]

  - name: fct_credit_allocation
    description: >
      Allocation grain. One row per credit per line it spreads over, in whole
      cents that sum back to the credit. allocation_scope says how far the credit
      could be placed, from the line it names down to nothing at all.
    columns:
      - name: credit_id
        tests: [not_null]
      - name: allocated_cents
        tests: [not_null]
      - name: allocation_scope
        tests:
          - not_null
          - accepted_values:
              values: ['direct', 'vendor_quarter', 'invoice', 'unallocated']

  - name: credit_rollup_by_line
    description: >
      The single rollup of credits to line grain, carrying the named total and
      the allocated total side by side. The margin marts read this and never the
      credit facts.
    columns:
      - name: line_id
        tests: [unique, not_null]

  - name: margin_by_vendor
    columns:
      - name: vendor_id
        tests: [not_null]
      - name: invoiced_margin_usd
        tests: [not_null]
      - name: margin_after_allocated_credits_usd
        tests: [not_null]

  - name: margin_by_partner
    columns:
      - name: period
        tests: [not_null]

  - name: margin_by_product_line
    columns:
      - name: product_line
        tests: [not_null]
      - name: period
        tests: [not_null]

  - name: scan_margin_lines_unclustered
    description: >
      The control half of the layout pair. No partitioning and no clustering.
    columns:
      - name: line_id
        tests: [unique, not_null]

  - name: scan_margin_lines_clustered
    description: >
      The treatment half. Monthly partitions on invoice_date and clustering on
      vendor_id then partner_id then product_line, on BigQuery only.
    columns:
      - name: line_id
        tests: [unique, not_null]

  - name: fct_gl_posting
    description: >
      Document grain with both sides on one row. One row per billing document per
      account, plus a row for every ledger entry whose document billing does not
      hold. match_class says which of the five cases a row is.
    columns:
      - name: account
        tests: [not_null]
      - name: match_class
        tests:
          - not_null
          - accepted_values:
              values:
                - matched_same_period
                - matched_ledger_is_later
                - matched_ledger_is_earlier
                - in_billing_not_in_ledger
                - in_ledger_not_in_billing
      - name: difference_cents
        tests: [not_null]

  - name: recon_billing_to_gl
    description: >
      Period and account grain. The variance between the two systems split into
      timing, which clears next period, and a break, which does not. The split
      is exact in whole cents and a singular test asserts it. Timing nets to zero
      over the whole corpus, because moving money between periods cannot create
      any, and a second test asserts that too.
    columns:
      - name: period
        tests: [not_null]
      - name: account
        tests: [not_null]
      - name: variance_cents
        tests: [not_null]
      - name: break_cents
        tests: [not_null]

  - name: alert_late_credit_arrival
    description: >
      One row per placeable credit that arrived later than the reconciliation
      reopens, so the period it adjusts was closed before the credit existed.
      stale_period is the period whose margin is now wrong.
    columns:
      - name: credit_id
        tests: [unique, not_null]
      - name: stale_period
        tests: [not_null]
      - name: days_past_the_window
        tests: [not_null]
